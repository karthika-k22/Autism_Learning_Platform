{% extends "base.html" %}

{% block content %}
<div class="glass-panel" style="max-width: 600px; margin: 0 auto; height: 70vh; display: flex; flex-direction: column;">
    <div class="chat-header mb-2"
        style="border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 1rem; display: flex; align-items: center; gap: 1rem;">
        <div
            style="font-size: 2rem; background: rgba(255,255,255,0.2); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
            🤖
        </div>
        <div>
            <h2>AI Companion</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Always here to listen.</p>
        </div>
    </div>

    <div id="chat-history"
        style="flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem;">
        <!-- Initial Message -->
        <div class="message bot-message">
            Hi {{ current_user.username }}! I'm your AI friend. How are you feeling today?
        </div>
    </div>

    <div class="chat-input-area" style="margin-top: 1rem; display: flex; gap: 0.5rem;">
        <input type="text" id="chat-input" class="form-input" placeholder="Type a message..."
            style="border-radius: 20px;">
        <button id="send-btn" class="btn-primary"
            style="border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>
</div>

<style>
    .message {
        padding: 1rem 1.25rem;
        border-radius: 16px;
        max-width: 75%;
        line-height: 1.5;
        word-wrap: break-word;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .bot-message {
        background: #ffffff;
        color: #1a202c;
        align-self: flex-start;
        border-bottom-left-radius: 4px;
        border: 1px solid #e2e8f0;
    }

    .user-message {
        background: #3182ce;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
        color: #ffffff;
        font-weight: 500;
    }
</style>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>
{% endblock %}
